name: Extract Project ZIP

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract project ZIP
        run: |
          mkdir -p extracted
          unzip -o youtube-automation-agent-master.zip -d extracted

          if [ -d "extracted/youtube-automation-agent-master" ]; then
            cp -r extracted/youtube-automation-agent-master/. .
          else
            echo "Project folder not found!"
            exit 1
          fi

          rm -rf extracted
          rm -f youtube-automation-agent-master.zip

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Commit extracted files
        run: |
          git add -A
          git commit -m "Extract YouTube automation project" || echo "No changes"

      - name: Push changes
        run: git push origin HEAD
