name: ImagineX Daily Autonomous YouTube Automation

on:
  schedule:
    # 00:30 UTC = 06:00 AM Asia/Kolkata (IST) every day
    - cron: '30 0 * * *'
  workflow_dispatch:
    inputs:
      privacy_status:
        description: 'Video Visibility (public, private, unlisted)'
        required: false
concurrency:
  group: imaginex-daily-pipeline
  cancel-in-progress: false

jobs:
  run-daily-pipeline:
    name: Generate & Publish Daily Video
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install System FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          ffmpeg -version

      - name: Install Dependencies
        run: npm ci

      - name: Run Autonomous Daily YouTube Pipeline
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_FLUX_MODEL: ${{ secrets.CLOUDFLARE_FLUX_MODEL || '@cf/black-forest-labs/flux-2-klein-4b' }}
          YOUTUBE_TOKENS_JSON: ${{ secrets.YOUTUBE_TOKENS_JSON }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID || secrets.GOOGLE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET || secrets.GOOGLE_CLIENT_SECRET }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID || secrets.YOUTUBE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET || secrets.YOUTUBE_CLIENT_SECRET }}
          DEFAULT_PRIVACY_STATUS: ${{ github.event.inputs.privacy_status || 'public' }}
          NODE_ENV: production
        run: |
          node scripts/run_daily_pipeline.js
