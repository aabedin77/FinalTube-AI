name: Firestore Emulator & Integration CI

on:
  push:
    branches: [ main, firestore-ci-verification ]
  pull_request:
    branches: [ main, firestore-ci-verification ]

jobs:
  test-firestore-emulator:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Setup Java JRE 17 (Required for Firebase Firestore Emulator)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install NPM Dependencies
        run: npm install

      - name: Install Firebase CLI Global
        run: npm install -g firebase-tools

      - name: Execute Full System Test Suite
        run: npm test

      - name: Execute Firestore Migration Dry Run
        run: node scripts/migrate-sqlite-to-firestore.js --dry-run

      - name: Execute Real Firestore Emulator Integration & Reverse Sync Test
        run: |
          firebase emulators:exec --only firestore "node scripts/test-emulator-integration.js"
