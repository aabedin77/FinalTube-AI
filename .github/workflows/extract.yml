name: Extract Project ZIP

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract project ZIP
        run: |
          mkdir -p extracted
          unzip -o youtube-automation-agent-master.zip -d extracted

          rsync -a \
            --exclude='.github/workflows/' \
            extracted/youtube-automation-agent-master/ ./

          rm -rf extracted
          rm -f youtube-automation-agent-master.zip

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Commit extracted files
        run: |
          git add -A
          git commit -m "Extract original YouTube automation project" || echo "No changes"

      - name: Push changes
        run: git push origin HEAD
